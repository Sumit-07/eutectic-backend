# Placeholder CI — decorative until GitHub remotes exist (D-006).
# Runs typecheck across this repo's packages once it is part of the
# eutectic pnpm workspace (workspace root: pnpm-workspace.yaml, tsconfig.base.json,
# turbo.json — see operating-model.md §3, D-004). Local equivalent today:
#   pnpm install && pnpm -r typecheck   (run from the workspace root)
name: CI

on:
  # Gated until M0-SH-05 builds real per-repo CI (child repo alone lacks the
  # workspace root, so this job cannot pass on GitHub yet - see D-009).
  workflow_dispatch:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 22.9.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r typecheck
